syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";
import "agent/v2/common.proto";

// WebhookService exposes the queue of git-provider webhooks that Dwaar
// forwards to the agent, and builds the agent ran on the server when no Mac
// was online. All RPCs are read-only. This is the webhook delivery store of
// signed-plan.md 3.5 (admissions.db deliveries): the agent authenticates each
// delivery with the provider HMAC, records it, and builds one rule-backed
// plan per matching standing rule (e.g. auto-deploy main -> production).
// Admission consumes the delivery once per rule. Unmatched deliveries wait
// for the engine.
//
// Intake rules (signed-plan.md 3.5): body capped at 1 MiB; the provider HMAC
// or GitLab token is checked in constant time before the body is parsed;
// body_digest_hex is unique (duplicates are DUPLICATE); a delivery older than
// 15 minutes (received_at) never backs a plan (STALE); a commit that is not
// newer than the branch's deployed commit is IGNORED.
//
// v2.1.0 (capability "webhooks.v1", agent-protocol.md 11): Dwaar forwards
// POST /hooks/<project_id> to the agent's listener on 127.0.0.1:7461; the
// runner verifies the provider HMAC (webhook_verify, the secret is sealed)
// and, from contracts v1.1.0, parses and records the verified push itself (a
// consumed-log "delivery" line, the only evidence the runner accepts);
// rule-backed deploys are always built on the server by rootless BuildKit as
// user permanu-build (runner op build_image, D-050). Unmatched deliveries wait
// PENDING for the engine until they expire (7 days).
service WebhookService {
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse);
  rpc GetWebhookDelivery(GetWebhookDeliveryRequest) returns (WebhookDelivery);
  rpc GetWebhookQueueStatus(GetWebhookQueueStatusRequest) returns (WebhookQueueStatus);
  rpc ListServerBuilds(ListServerBuildsRequest) returns (ListServerBuildsResponse);
  rpc GetServerBuild(GetServerBuildRequest) returns (ServerBuild);
}

enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNSPECIFIED = 0;
  // Queued, waiting for engine or rule. v2.1.4 (contracts v1.1.4, D-062):
  // when the agent admits a rule.create it re-matches every unexpired
  // PENDING delivery of that project against the new rule, oldest first
  // (agent-protocol.md 11.1; the 900 s evidence window still applies).
  WEBHOOK_DELIVERY_STATUS_PENDING = 1;
  // Never set from v2.1.0: the engine tracks what it has seen with
  // ListWebhookDeliveriesRequest.after_delivery_id, and nothing claims a
  // delivery (a claim would be an unsigned server change).
  WEBHOOK_DELIVERY_STATUS_CLAIMED_BY_ENGINE = 2;
  WEBHOOK_DELIVERY_STATUS_BUILDING = 3;         // on-server build in progress
  WEBHOOK_DELIVERY_STATUS_DEPLOYED = 4;
  WEBHOOK_DELIVERY_STATUS_IGNORED = 5;          // no matching project/branch/rule
  WEBHOOK_DELIVERY_STATUS_REJECTED = 6;         // bad signature or malformed
  WEBHOOK_DELIVERY_STATUS_FAILED = 7;
  WEBHOOK_DELIVERY_STATUS_EXPIRED = 8;
  WEBHOOK_DELIVERY_STATUS_DUPLICATE = 9;        // same body_digest_hex seen before
  // v2.1.3 (contracts v1.1.3, D-061): the build of the commit could not
  // start within 900 s of the delivery, or its rule plan was not admitted
  // within 900 s of the build's end (signed-plan.md 6.1 step 12).
  WEBHOOK_DELIVERY_STATUS_STALE = 10;
}

message WebhookDelivery {
  // The agent-minted UUIDv7 (admissions.db deliveries.delivery_id); v2.1.3
  // (contracts v1.1.3, D-061): the value RuleInvocation.evidence.delivery_id
  // carries.
  string id = 1;
  google.protobuf.Timestamp received_at = 2;
  string provider = 3;   // "github" | "gitlab" | "gitea" | "generic"
  string event = 4;      // e.g. "push", "pull_request"
  // Provider delivery id (X-GitHub-Delivery), informational only.
  // v2.1.3 (contracts v1.1.3, D-061): RuleInvocation.evidence.delivery_id is
  // WebhookDelivery.id, the UUIDv7 the agent mints (admissions.db
  // deliveries.delivery_id), never this value.
  string delivery_ref = 5;
  string repository = 6;
  string ref = 7;
  string commit_sha = 8;
  string project_id = 9;
  bool signature_valid = 10;
  WebhookDeliveryStatus status = 11;
  string status_reason = 12;
  // Standing rule that authorized an on-server build, if any.
  string standing_rule_id = 13;
  string operation_id = 14;
  string build_id = 15;
  uint32 attempts = 16;
  google.protobuf.Timestamp processed_at = 17;
  // Body is not returned; only its digest (hex, unique) and size.
  string body_digest_hex = 18;
  uint64 body_bytes = 19;
  // When the provider HMAC verified; unset when signature_valid is false.
  google.protobuf.Timestamp verified_at = 20;
  // True once a rule-backed plan citing this delivery was admitted.
  bool consumed = 21;
  // plan.id of every admission that cited this delivery (one per rule).
  repeated string consumed_by_plan_ids = 22;
  // Rules that consumed it; a delivery is consumed per (delivery, rule).
  repeated string consumed_by_rule_ids = 23;
  // Commit timestamp from the push payload (RuleInvocation.evidence.commit_time).
  google.protobuf.Timestamp commit_time = 24;
  // v2.1.0. When a PENDING delivery becomes EXPIRED (received_at + 7 days).
  google.protobuf.Timestamp expires_at = 25;
  // v2.1.0 (contracts v1.1.0). Environments whose PERMANU_WEBHOOK_SECRET
  // verified the delivery (webhook_verify). A rule matches only when its
  // environment is one of them.
  repeated string environments = 26;
}

message ListWebhookDeliveriesRequest {
  repeated WebhookDeliveryStatus statuses = 1;
  string project_id = 2;
  TimeRange range = 3;
  PageRequest page = 4; // newest first
  // v2.1.0. When set, deliveries with an id greater than this one (UUIDv7
  // order) in ascending order, for the engine's offline reconcile.
  string after_delivery_id = 5;
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  PageInfo page = 2;
}

message GetWebhookDeliveryRequest {
  string delivery_id = 1;
}

message GetWebhookQueueStatusRequest {}

message WebhookQueueStatus {
  uint32 pending = 1;
  uint32 building = 2;
  google.protobuf.Timestamp oldest_pending_at = 3;
  uint32 processed_24h = 4;
  uint32 failed_24h = 5;
  // Whether an engine session is currently connected over v2.
  bool engine_connected = 6;
  google.protobuf.Timestamp engine_last_seen_at = 7;
  // Whether on-server builds are possible (BuildKit present, capability on).
  bool server_builds_enabled = 8;
  // v2.1.0. engine_id of the connected (or last) engine session.
  string engine_id = 9;
  uint32 duplicates_24h = 10;
  // Deliveries that failed the HMAC or token check in the last 24 h.
  uint32 rejected_24h = 11;
  // Builds waiting for the single build slot.
  uint32 builds_queued = 12;
  // v2.1.3 (contracts v1.1.3, D-061). The hostname Dwaar routes
  // /hooks/<project_id> on: the latest succeeded webhook.host.set on this
  // server; "" before one. Push URL: https://<webhook_host>/hooks/<project_id>.
  string webhook_host = 13;
}

enum ServerBuildStatus {
  SERVER_BUILD_STATUS_UNSPECIFIED = 0;
  SERVER_BUILD_STATUS_QUEUED = 1;
  SERVER_BUILD_STATUS_CLONING = 2;
  SERVER_BUILD_STATUS_BUILDING = 3;
  SERVER_BUILD_STATUS_DEPLOYING = 4;
  SERVER_BUILD_STATUS_SUCCEEDED = 5;
  SERVER_BUILD_STATUS_FAILED = 6;
  SERVER_BUILD_STATUS_ROLLED_BACK = 7;
  SERVER_BUILD_STATUS_CANCELLED = 8;
}

message ServerBuild {
  string id = 1;
  string delivery_id = 2;
  string project_id = 3;
  string service_id = 4;
  string commit_sha = 5;
  string ref = 6;
  ServerBuildStatus status = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
  // Hex manifest digest of the image the agent built; a rule deploy's
  // ServiceSpec.image_digest_hex must equal it (signed-plan.md 3.7).
  string image_digest_hex = 10;
  string deployment_id = 11;
  string operation_id = 12;
  string standing_rule_id = 13;
  string error = 14;
  // v2.1.0. OCI platform built, e.g. "linux/amd64" (the server's arch).
  string platform = 15;
  string environment_id = 16;
  // v2.1.0. Sub-reason of a FAILED build: "source_fetch" (including a ref
  // whose head is no longer commit_sha), "recipe_missing", "build",
  // "timeout", "cache_full", "buildkit_unavailable", "build_queue_full".
  // Empty otherwise. The engine copies it into Engine API
  // Deployment.failure_detail (failure_code "build").
  string failure_reason = 17;
  // v2.1.3 (contracts v1.1.3, D-061). id is agent-minted at QUEUED; this is
  // the runner's build_id (its build_started and build lines, admissions.db
  // builds.build_id), "" until the runner accepted build_image.
  string runner_build_id = 18;
}

message ListServerBuildsRequest {
  string project_id = 1;
  repeated ServerBuildStatus statuses = 2;
  PageRequest page = 3; // newest first
  // v2.1.0. Builds whose started_at is in range (offline reconcile,
  // agent-protocol.md 12.2). Unset = all.
  TimeRange range = 4;
}

message ListServerBuildsResponse {
  repeated ServerBuild builds = 1;
  PageInfo page = 2;
}

message GetServerBuildRequest {
  string build_id = 1;
}
