syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "agent/v2/common.proto";
import "agent/v2/telemetry.proto";

// AlertService exposes the on-server alert evaluator. Reads and channel tests
// are unsigned. Rule, channel and silence mutations are server-level signed
// plans via ChangeService.SubmitSignedPlan (kinds "alert.rule.create",
// "alert.rule.update", "alert.rule.delete", "alert.silence",
// "alert.channel.create", "alert.channel.update", "alert.channel.delete";
// owner or deployer, presence Touch ID). A rule's plan `spec` is the proto3
// JSON of AlertRule without server-assigned fields.
// v2.1.0 (capability "alerts.v1"): evaluation interval, state machine and
// channel delivery are agent-protocol.md 10.3. Channel credentials are sealed
// to the server and decrypted only by the runner, which posts notifications
// (runner op notify_channel); the agent never holds a channel URL or secret.
service AlertService {
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse);
  rpc GetAlertRule(GetAlertRuleRequest) returns (AlertRule);
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse);
  // TestNotificationChannel sends a fixed test message. Rate limited to one
  // test per channel per 10 s. No user-supplied content is sent. v2.1.0: sent
  // through the runner's notify_channel like every notification.
  rpc TestNotificationChannel(TestNotificationChannelRequest) returns (TestNotificationChannelResponse);
  // ListAlertEvents streams alert history in ascending time order, then
  // live events when follow=true.
  rpc ListAlertEvents(ListAlertEventsRequest) returns (stream AlertEventsResponse);
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_INFO = 1;
  ALERT_SEVERITY_WARNING = 2;
  ALERT_SEVERITY_CRITICAL = 3;
}

enum ComparisonOp {
  COMPARISON_OP_UNSPECIFIED = 0;
  COMPARISON_OP_GT = 1;
  COMPARISON_OP_GTE = 2;
  COMPARISON_OP_LT = 3;
  COMPARISON_OP_LTE = 4;
  COMPARISON_OP_EQ = 5;
  COMPARISON_OP_NEQ = 6;
  // No data point for the metric during the whole for_duration (threshold
  // ignored). Engine API op "absent".
  COMPARISON_OP_ABSENT = 7;
}

// MetricCondition fires when the aggregated metric crosses threshold for
// the whole for_duration.
message MetricCondition {
  string metric = 1;
  repeated LabelMatcher matchers = 2;
  MetricAggregation aggregation = 3;
  google.protobuf.Duration window = 4;
  ComparisonOp op = 5;
  double threshold = 6;
  google.protobuf.Duration for_duration = 7;
}

// LogCondition fires when more than `count` matching records arrive in window.
message LogCondition {
  Scope scope = 1;
  LogLevel min_level = 2;
  string contains = 3;
  string regex = 4;
  google.protobuf.Duration window = 5;
  uint32 count = 6;
}

// EventCondition fires on built-in events.
// v2.1.5 (contracts v1.1.5, D-063): the Engine API AlertRule.condition
// {event} maps cron_missed -> KIND_CRON_MISSED, cron_failed ->
// KIND_CRON_FAILED, backup_failed -> KIND_BACKUP_FAILED, deploy_failed ->
// KIND_DEPLOY_FAILED and build_failed -> KIND_WEBHOOK_BUILD_FAILED (an
// on-server build that ended FAILED; CANCELLED is not a failure). A v2.1
// agent evaluates these five kinds and refuses a rule of an event kind it
// does not evaluate (EXEC_PRECONDITION); agent-protocol.md 10.3.
//
// v2.1.6 (contracts v1.1.6, D-064): scope names at most one service; an
// Engine API event rule naming several services is signed as one rule per
// service (the engine splits it), so Scope stays unchanged.
message EventCondition {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DEPLOY_FAILED = 1;
    KIND_ROLLBACK = 2;
    KIND_HEALTH_CHECK_FAILING = 3;
    KIND_CONTAINER_OOM = 4;
    KIND_CONTAINER_RESTART_LOOP = 5;
    KIND_CRON_FAILED = 6;
    KIND_CRON_MISSED = 7;
    KIND_BACKUP_FAILED = 8;
    KIND_RESTORE_VERIFICATION_FAILED = 9;
    KIND_CERT_EXPIRING = 10;
    KIND_DISK_PRESSURE = 11;
    KIND_MEMORY_PRESSURE = 12;
    KIND_WEBHOOK_BUILD_FAILED = 13;
    KIND_TELEMETRY_DROPPING = 14;
  }
  Kind kind = 1;
  Scope scope = 2;
}

message AlertRule {
  string id = 1;
  string name = 2;
  AlertSeverity severity = 3;
  oneof condition {
    MetricCondition metric = 4;
    LogCondition log = 5;
    EventCondition event = 6;
  }
  // NotificationChannel ids.
  repeated string channel_ids = 7;
  // Minimum gap between repeated notifications while firing.
  google.protobuf.Duration repeat_interval = 8;
  bool notify_on_resolve = 9;
  bool enabled = 10;
  // Silenced until this time (set by an "alert.silence" plan).
  google.protobuf.Timestamp silenced_until = 11;
  AlertState state = 12;
  google.protobuf.Timestamp state_since = 13;
  string plan_digest_hex = 14;
  // v2.1.0. Last evaluation and the value it saw (metric and log rules; NaN
  // when there was no data). Event rules are evaluated on each event.
  google.protobuf.Timestamp last_evaluated_at = 15;
  double last_value = 16;
}

enum AlertState {
  ALERT_STATE_UNSPECIFIED = 0;
  ALERT_STATE_OK = 1;
  ALERT_STATE_PENDING = 2; // condition true, for_duration not yet elapsed
  ALERT_STATE_FIRING = 3;
  ALERT_STATE_RESOLVED = 4;
  ALERT_STATE_NO_DATA = 5;
  // Silenced by an admitted alert.silence plan until silenced_until.
  // Engine API state "muted".
  ALERT_STATE_MUTED = 6;
}

message NotificationChannel {
  string id = 1;
  string name = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SLACK = 1;   // incoming webhook
    KIND_DISCORD = 2; // webhook
    KIND_WEBHOOK = 3; // generic HTTPS POST, HMAC-signed body
  }
  Kind kind = 3;
  // Redacted target for display, e.g. "hooks.slack.com/services/T0…/…".
  // The full URL/secret lives server-side under credential_ref.
  string target_display = 4;
  string credential_ref = 5;
  bool enabled = 6;
  DeliveryResult last_delivery = 7;
  string plan_digest_hex = 8;
  // v2.1.0. SHA-256 of the sealed credential ciphertext the plan signed
  // (alert.channel.create/update credential_ciphertext_digest_hex).
  string credential_ciphertext_digest_hex = 9;
}

message DeliveryResult {
  string channel_id = 1;
  bool ok = 2;
  int32 http_status = 3;
  string error = 4;
  google.protobuf.Timestamp attempted_at = 5;
  uint32 attempts = 6;
}

message AlertEvent {
  string id = 1;
  string rule_id = 2;
  string rule_name = 3;
  AlertSeverity severity = 4;
  AlertState state = 5; // FIRING or RESOLVED
  string summary = 6;
  map<string, string> labels = 7;
  double value = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp resolved_at = 10;
  repeated DeliveryResult deliveries = 11;
  // Opaque cursor for resuming ListAlertEvents.
  string cursor = 12;
  // v2.1.0. "rule" (an AlertRule), "cron_heartbeat" (a cron job's
  // heartbeat_alert) or "backup" (a backup or verify-restore failure of a
  // policy with channel_ids). rule_id is "" unless source is "rule".
  string source = 13;
  // v2.1.0. The cron_id or backup policy id for those sources.
  // v2.1.6 (contracts v1.1.6, D-064): the Engine API Alert then has rule_id
  // null, source and subject_id.
  string subject_id = 14;
}

message ListAlertRulesRequest {
  repeated AlertState states = 1;
  PageRequest page = 2;
}

message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
  PageInfo page = 2;
}

message GetAlertRuleRequest {
  string rule_id = 1;
}

message ListNotificationChannelsRequest {
  PageRequest page = 1;
}

message ListNotificationChannelsResponse {
  repeated NotificationChannel channels = 1;
  PageInfo page = 2;
}

message TestNotificationChannelRequest {
  string channel_id = 1;
}

message TestNotificationChannelResponse {
  DeliveryResult result = 1;
}

message ListAlertEventsRequest {
  string rule_id = 1;
  repeated AlertSeverity severities = 2;
  TimeRange range = 3;
  // 0 = 200; max 2000.
  uint32 limit = 4;
  string cursor = 5;
  bool follow = 6;
}

message AlertEventBatch {
  repeated AlertEvent events = 1;
}

message AlertEventsResponse {
  oneof frame {
    AlertEventBatch batch = 1;
    StreamStatus status = 2;
  }
}
