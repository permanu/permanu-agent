syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";
import "agent/v2/common.proto";

// ShellService provides the only interactive exec path in local mode. There
// is no unsigned exec: the first client frame must be ShellOpen carrying a
// SignedPlan whose only action is "shell.open", user-signed with a fresh
// Touch ID by an owner key in every environment (signed-plan.md 10.1;
// standing rules never authorize shell.open).
//
// The target comes only from the signed plan: params.service_id names the
// service (the agent picks one of its running containers itself) and null
// means a host login shell as the permanu-shell user (capability
// "shell.host"). v2.1.6 (contracts v1.1.6, D-064): a host shell's plan is
// server-level (no project_id, environment or environment_id; this server in
// targets); the earlier project-level form is still admitted (deprecated).
// The client cannot name a container or a command. The session is audited
// and ends at params.ttl_seconds (max 900 s) or after 15 min idle.
// v2.1.7 (contracts v1.1.7, D-065): at most 4 shells (service and host) per
// agent; the 5th ShellOpen ends the stream with RESOURCE_EXHAUSTED +
// LIMIT_EXCEEDED before the plan is admitted, and the runner refuses a 5th
// per server with E_SHELL_LIMIT (LIMIT_EXCEEDED). A host shell runs in the
// transient systemd unit permanu-shell-<plan_id>.service (agent-protocol.md
// section 8).
// v2.1.9 (contracts v1.1.9, D-067): a host shell open (service_id null) is
// not counted by the 10 plan submissions per minute of SubmitSignedPlan; it
// has its own limit of 20 opens per hour per server (a rolling hour; the
// 21st ends the stream with RESOURCE_EXHAUSTED + RATE_LIMITED before the plan
// is admitted, never retried). The permanu-shell user has uid and gid 900100.
service ShellService {
  rpc Shell(stream ShellClientFrame) returns (stream ShellServerFrame);
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ShellOpen {
  SignedPlan plan = 1;
  // The target and command are never client-supplied (signed-plan.md 3.2
  // shell.open): the agent resolves them from the plan.
  reserved 2, 3;
  reserved "target", "argv";
  bool tty = 4;
  string term = 5; // e.g. "xterm-256color"
  TerminalSize size = 6;
}

message ShellClientFrame {
  oneof frame {
    ShellOpen open = 1;   // must be first, exactly once
    bytes stdin = 2;      // max 32 KiB per frame
    TerminalSize resize = 3;
    string signal = 4;    // "INT" | "TERM" | "HUP" | "QUIT" | "KILL"
    bool close_stdin = 5; // EOF
  }
}

message ShellOpened {
  string session_id = 1;
  string plan_digest_hex = 2;
  // Session is terminated at this time: opened_at + params.ttl_seconds,
  // never more than 900 s after open.
  google.protobuf.Timestamp expires_at = 3;
  // True when the session transcript is recorded in the agent audit log.
  bool recorded = 4;
  // What the agent resolved from the plan: the service (empty for a host
  // shell) and the container it chose.
  string service_id = 5;
  string container_name = 6;
}

// v2.1.7 (contracts v1.1.7, D-065): the values come from the runner's
// shell_open result line (signed-plan.md 14.8). reason "exited": the shell
// ended by itself; then either exit_code is its exit status and signal is
// empty, or signal names the signal that killed it (exit_code 0, ignored).
// Any other reason: exit_code is ignored and signal names the signal that
// ended the shell when known, else empty. The engine's shell exit event is
// {exit_code, signal} with null for an ignored or empty value.
message ShellExit {
  int32 exit_code = 1;
  // A signal name such as "SIGKILL" or "SIGHUP"; empty when none.
  string signal = 2;
  // "exited" | "expired" | "idle_timeout" | "client_closed" | "error"
  string reason = 3;
}

message ShellServerFrame {
  oneof frame {
    ShellOpened opened = 1;
    bytes stdout = 2; // max 32 KiB per frame
    bytes stderr = 3; // only when tty=false
    ShellExit exit = 4; // final frame
  }
}
