syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";
import "agent/v2/common.proto";
import "agent/v2/telemetry.proto";

// ScheduleService exposes the agent's cron scheduler. Reads are unsigned.
// Create/update/delete are signed plans submitted via
// ChangeService.SubmitSignedPlan (kinds "cron.create", "cron.update",
// "cron.delete", "cron.pause", "cron.resume"). CronJob mirrors the
// cron.create/update params exactly (signed-plan.md 3.2): service_id, name
// (signed since contracts v1.1.0), schedule, timezone, command (argv),
// timeout_seconds, retries, overlap, heartbeat_alert. RunCronJobNow carries
// its own SignedPlan. contracts v1.1.0: the service and the job must belong
// to the plan's signed project and environment (SCOPE_MISMATCH otherwise).
// v2.1.0 (capability "cron.v1"): scheduler semantics (timezone, retries,
// overlap, missed runs, heartbeat alerts) are agent-protocol.md 10.1; each
// run is the runner op run_cron.
service ScheduleService {
  rpc ListCronJobs(ListCronJobsRequest) returns (ListCronJobsResponse);
  rpc GetCronJob(GetCronJobRequest) returns (CronJob);
  rpc ListCronRuns(ListCronRunsRequest) returns (ListCronRunsResponse);
  rpc GetCronRun(GetCronRunRequest) returns (CronRun);
  // RunCronJobNow triggers one out-of-schedule run. Requires a user-signed
  // SignedPlan whose only action is "cron.run" whose params.cron_id equals
  // RunCronJobNowRequest.cron_id exactly; otherwise FAILED_PRECONDITION /
  // EXEC_PRECONDITION (E_EXEC_PRECONDITION) and nothing runs.
  // Standing rules never authorize it (v1 rules allow deploy only).
  // Overlap policy still applies.
  rpc RunCronJobNow(RunCronJobNowRequest) returns (RunCronJobNowResponse);
  // StreamCronRunLogs streams the output of one run (follow while running).
  rpc StreamCronRunLogs(StreamCronRunLogsRequest) returns (stream LogQueryResponse);
}

// OverlapPolicy is the plan's overlap param: "skip" | "queue" | "allow".
// v2.1.0: there is no "replace" policy (value 4 stays reserved); a job that
// must stop the running attempt first is modelled with timeout_seconds.
enum OverlapPolicy {
  OVERLAP_POLICY_UNSPECIFIED = 0; // treated as SKIP
  OVERLAP_POLICY_SKIP = 1;        // "skip": skip the new run while one is active
  OVERLAP_POLICY_ALLOW = 2;       // "allow": run concurrently
  OVERLAP_POLICY_QUEUE = 3;       // "queue": queue at most one pending run
  reserved 4;
  reserved "OVERLAP_POLICY_REPLACE";
}

// Engine API CronRun.status maps one to one (agent-protocol.md 10.1):
// pending, running, succeeded, failed, timeout (TIMED_OUT), skipped
// (SKIPPED_OVERLAP), cancelled, missed.
enum CronRunStatus {
  CRON_RUN_STATUS_UNSPECIFIED = 0;
  CRON_RUN_STATUS_PENDING = 1;
  CRON_RUN_STATUS_RUNNING = 2;
  CRON_RUN_STATUS_SUCCEEDED = 3;
  CRON_RUN_STATUS_FAILED = 4;
  CRON_RUN_STATUS_TIMED_OUT = 5;
  CRON_RUN_STATUS_SKIPPED_OVERLAP = 6;
  CRON_RUN_STATUS_CANCELLED = 7;
  CRON_RUN_STATUS_MISSED = 8; // agent was down at schedule time
}

enum CronTrigger {
  CRON_TRIGGER_UNSPECIFIED = 0;
  CRON_TRIGGER_SCHEDULE = 1;
  CRON_TRIGGER_MANUAL = 2;
  CRON_TRIGGER_RETRY = 3;
}

message CronJob {
  // cron_id of the signed plan (UUIDv7).
  string id = 1;
  // The signed cron.create/update name (contracts v1.1.0; "" for a job
  // admitted before it was signed).
  string name = 2;
  Scope scope = 3;
  // 5-field cron expression (the only form a plan can carry).
  string schedule = 4;
  string timezone = 5; // IANA name or "UTC"
  // Replaced by service_id + command; runs start a one-off container from
  // the service's admitted ServiceSpec with command as argv.
  reserved 6, 8, 9, 10;
  reserved "target", "retry", "timeout", "heartbeat";
  OverlapPolicy overlap = 7;
  bool enabled = 11;
  google.protobuf.Timestamp next_run_at = 12;
  CronRun last_run = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // Hex digest of the signed plan that last changed this job.
  string plan_digest_hex = 16;
  // Retries after the first attempt, 0-10 (exponential backoff from 10 s,
  // capped at 10 min; agent defaults, not configurable in v2.0).
  uint32 retries = 17;
  // Alert on a failed or missed run (plan heartbeat_alert).
  bool heartbeat_alert = 18;
  string service_id = 19;
  // argv, 1-64 entries of <= 1024 bytes.
  repeated string command = 20;
  // 1-86400.
  uint32 timeout_seconds = 21;
}

message CronRun {
  string id = 1;
  string cron_id = 2;
  uint32 attempt = 3;
  CronTrigger trigger = 4;
  CronRunStatus status = 5;
  google.protobuf.Timestamp scheduled_for = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  int32 exit_code = 9;
  string error = 10;
  uint64 output_bytes = 11;
  // Set for manual runs.
  string operation_id = 12;
  // v2.1.0. For a MISSED run: how many scheduled times fell inside the
  // downtime it stands for (agent-protocol.md 10.1, missed runs). 0 otherwise.
  uint32 missed_count = 13;
  // v2.1.0. When the next retry attempt starts; unset when none is pending.
  google.protobuf.Timestamp next_retry_at = 14;
  // v2.1.0. Name of the one-off container of this attempt ("" before start).
  string container_name = 15;
  // v2.1.0. plan.id of the cron.create/update (or cron.run) admission this
  // attempt ran under.
  string plan_id = 16;
}

message ListCronJobsRequest {
  Scope scope = 1;
  PageRequest page = 2;
}

message ListCronJobsResponse {
  repeated CronJob jobs = 1;
  PageInfo page = 2;
}

message GetCronJobRequest {
  string cron_id = 1;
}

message ListCronRunsRequest {
  string cron_id = 1; // "" = all jobs
  repeated CronRunStatus statuses = 2;
  TimeRange range = 3;
  PageRequest page = 4; // newest first
}

message ListCronRunsResponse {
  repeated CronRun runs = 1;
  PageInfo page = 2;
}

message GetCronRunRequest {
  string run_id = 1;
}

message RunCronJobNowRequest {
  // Must equal the cron.run action's params.cron_id.
  string cron_id = 1;
  SignedPlan plan = 2;
}

message RunCronJobNowResponse {
  OperationRef operation = 1;
  string run_id = 2;
}

message StreamCronRunLogsRequest {
  string run_id = 1;
  bool follow = 2;
  string cursor = 3;
}
