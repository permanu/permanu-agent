syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";
import "agent/v2/common.proto";
import "agent/v2/events.proto";

// DatabaseService (v2.1.6, contracts v1.1.6, D-064; capability
// "database.v1") reads a database service's tables and rows through the
// runner op db_query (signed-plan.md 14.3): a read-only transaction with
// statement_timeout 5 s and at most 500 rows, every schema, table and column
// name checked against the live catalog and quoted, every filter value a bound
// parameter. There is no SQL field. Rows are not redacted and may hold secret
// values: the engine serves them only to the app (Engine API services.db.rows
// / services.db.tables), never to an agent or MCP tool.
//
// v2.1.8 (contracts v1.1.8, D-066): the runner connects as the read-only role
// permanu_reader (created by the service deploy; NOSUPERUSER NOCREATEROLE,
// pg_read_all_data or explicit SELECT grants) with search_path pinned empty;
// the schemas pg_catalog, information_schema, pg_toast and any pg_* and every
// relation that is not a table (relkind r) or partitioned table (p) are
// refused with INVALID_ARGUMENT + VALIDATION. The statement timeout (runner
// error.reason "timeout") is DEADLINE_EXCEEDED with the message
// "statement timeout"; a database with no reader role yet is
// FAILED_PRECONDITION + EXEC_PRECONDITION.
//
// v2.1.9 (contracts v1.1.9, D-067): a database without a working
// permanu_reader (missing, failed to provision, or its login fails) is
// FAILED_PRECONDITION + READER_MISSING, the runner's detail (reader_status,
// reader_reason) in the message.
service DatabaseService {
  rpc ListTables(ListTablesRequest) returns (ListTablesResponse);
  rpc QueryRows(QueryRowsRequest) returns (QueryRowsResponse);
  // v2.1.9 (contracts v1.1.9, D-067; capability "database.reader.v1").
  // Re-runs the reader provisioning of a managed PostgreSQL service through
  // the runner op db_reader_ensure (signed-plan.md 14.3): on the running
  // release of the service's last admitted spec, with the credentials of its
  // effective inputs (never from the request), the runner waits up to 120 s
  // for an authenticated TCP connection, creates or updates permanu_reader
  // (a new password) and logs in as it. No plan: it changes only the
  // read-only role. One call per database at a time (a second waits).
  // INVALID_ARGUMENT + VALIDATION when resource_id is not a managed
  // PostgreSQL service on this server; FAILED_PRECONDITION +
  // EXEC_PRECONDITION when no release of its last admitted spec runs. Engine
  // API services.db.repair_reader (app-only).
  rpc EnsureReader(EnsureReaderRequest) returns (DbReaderStatus);
}

message EnsureReaderRequest {
  // A database service (service_kind database, PostgreSQL) on this server.
  string resource_id = 1;
}

// v2.1.9 (contracts v1.1.9, D-067). The read-only role permanu_reader of a
// managed PostgreSQL service's running release, as the runner recorded it
// after activation (the reader_status / reader_reason of the action's result
// line, signed-plan.md 14.8) or after EnsureReader.
message DbReaderStatus {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Created or updated, and the runner logged in as permanu_reader.
    STATUS_READY = 1;
    // No provisioning ran for the running release (activated by a runner
    // before contracts v1.1.9).
    STATUS_MISSING = 2;
    // Provisioning ran and failed; reason says why.
    STATUS_FAILED = 3;
  }
  Status status = 1;
  // For FAILED: "not_ready" (no authenticated TCP connection within 120 s),
  // "auth_failed", "credentials_missing", "sql_error:<SQLSTATE>" or
  // "login_failed". Empty otherwise.
  string reason = 2;
  // The release (deployment id) the status was recorded on.
  string deployment_id = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message ListTablesRequest {
  // A database service (service_kind database) on this server.
  string resource_id = 1;
  // Schema name; "" = "public".
  string schema = 2;
}

message DbTable {
  string schema = 1;
  string name = 2;
  // pg_class.reltuples, 0 when unknown.
  uint64 rows_estimate = 3;
  uint64 size_bytes = 4;
}

message ListTablesResponse {
  // At most 1000.
  repeated DbTable tables = 1;
}

message DbFilter {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_EQ = 1;
    OP_NE = 2;
    OP_LT = 3;
    OP_LTE = 4;
    OP_GT = 5;
    OP_GTE = 6;
    OP_LIKE = 7;     // value: a string pattern of at most 256 bytes
    OP_IS_NULL = 8;  // value: bool_value true (IS NULL) or false (IS NOT NULL)
  }
  string column = 1;
  Op op = 2;
  // Bound as a parameter and cast to the column's type.
  // v2.1.8 (D-066): a number, bigint or numeric value travels as its decimal
  // string in string_value (e.g. "9007199254740993", "12.50"), never as a
  // float; number_value is never sent, and an agent refuses it with
  // INVALID_ARGUMENT + VALIDATION.
  oneof value {
    bool null_value = 3;
    string string_value = 4;
    double number_value = 5;
    bool bool_value = 6;
  }
}

message DbOrder {
  enum Dir {
    DIR_UNSPECIFIED = 0; // ascending
    DIR_ASC = 1;
    DIR_DESC = 2;
  }
  string column = 1;
  Dir dir = 2;
}

message QueryRowsRequest {
  string resource_id = 1;
  // "" = "public".
  string schema = 2;
  string table = 3;
  // At most 64, in output order; empty = every column in catalog order.
  repeated string columns = 4;
  // At most 16, AND-ed.
  repeated DbFilter filters = 5;
  // At most 4; empty = the primary key ascending, else (v2.1.8, D-066) the
  // first column ascending; never heap order.
  repeated DbOrder order_by = 6;
  // 1-500 (0 = 100); the runner caps it at 500.
  uint32 limit = 7;
  // next_cursor of the previous page of the same request; "" = first page.
  string cursor = 8;
}

message DbColumn {
  string name = 1;
  // PostgreSQL type name (format_type), e.g. "integer", "text".
  string type = 2;
}

message DbCell {
  // True for SQL NULL (text is then empty).
  bool is_null = 1;
  // The value's PostgreSQL text form (every type; bigint and numeric as
  // decimal strings; v2.1.9, D-067: a boolean is "true" or "false", never
  // PostgreSQL's t/f). v2.1.8 (D-066): cut at 64 KiB on a UTF-8 boundary (it
  // was 4096 bytes), with truncated true; the engine's JSON cell is null, the
  // text, or {text, truncated: true}.
  string text = 2;
  bool truncated = 3;
}

message DbRow {
  repeated DbCell cells = 1;
}

// v2.1.8 (D-066): at most 3 MiB encoded. The runner stops adding rows before
// its 3 MiB budget and sets next_cursor, so a page can hold fewer than limit
// rows while next_cursor is not empty; the agent never adds rows.
message QueryRowsResponse {
  repeated DbColumn columns = 1;
  // At most limit (500) rows.
  repeated DbRow rows = 2;
  // "" on the last page.
  string next_cursor = 3;
}

// StateService returns the server's current runtime state. All RPCs are
// read-only. GetStateSnapshot is what a client calls after
// EventService.Subscribe delivers RESYNC_REQUIRED: it returns health,
// deployments and services for a scope plus a resume_token to subscribe from,
// so no event between the snapshot and the subscription is lost.
service StateService {
  // ListContainers lists Permanu-managed containers on this server, filtered
  // by scope (project_id, environment/environment_id, service_id).
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  // GetStateSnapshot returns a consistent snapshot for one scope.
  // v2.1.10 (contracts v1.1.10, D-068): an agent that advertises
  // "database.reader.v1" serves it (never UNIMPLEMENTED + CAPABILITY_MISSING)
  // and fills ServiceState.db_reader; the engine reads it after every healthy
  // deploy of a managed PostgreSQL service (Engine API Deployment.db_reader).
  rpc GetStateSnapshot(GetStateSnapshotRequest) returns (StateSnapshot);
}

message ListContainersRequest {
  // Empty fields match all. server filtering is implicit: this agent only
  // reports its own server (StateSnapshot.server_id).
  Scope scope = 1;
  // Include stopped and exited containers.
  bool include_stopped = 2;
  PageRequest page = 3;
}

// Ids come from the Docker labels Permanu sets on every container it starts
// (agent-protocol.md 3.1): permanu.project_id, permanu.environment_id,
// permanu.service_id, permanu.deployment_id and permanu.spec_digest_hex; and
// (v2.0.5, D-045) environment and service_kind from permanu.environment and
// permanu.service_kind (empty for containers started before v2.0.5).
message Container {
  string container_id = 1;
  string name = 2;
  string server_id = 3;
  string project_id = 4;
  string environment = 5;
  string environment_id = 6;
  string service_id = 7;
  // Hex digest of the admitted ServiceSpec the container was started from
  // (signed-plan.md 3.7); empty for containers Permanu did not start.
  string spec_digest_hex = 8;
  // image_repository@sha256:<hex> as run.
  string image = 9;
  string image_digest_hex = 10;
  // "created" | "running" | "restarting" | "exited" | "paused" | "dead"
  string state = 11;
  HealthEvent.Status health = 12;
  google.protobuf.Timestamp started_at = 13;
  uint32 restart_count = 14;
  // Resource usage at the last sample.
  uint32 cpu_millis = 15;
  uint64 memory_bytes = 16;
  // v2.0.5 (D-045). The signed ServiceSpec.service_kind (signed-plan.md 3.7):
  // "web" | "worker" | "database" | "bucket" | "cron" | "static". QueryLogs
  // serves database and bucket containers as SERVICE and the rest as APP.
  string service_kind = 17;
}

message ListContainersResponse {
  repeated Container containers = 1;
  PageInfo page = 2;
}

message GetStateSnapshotRequest {
  // Empty fields match all (the whole server).
  Scope scope = 1;
}

// ServiceState is one service's admitted spec and live state on this server.
message ServiceState {
  string service_id = 1;
  string project_id = 2;
  string environment = 3;
  string environment_id = 4;
  // Last admitted spec digest and the release it runs.
  string spec_digest_hex = 5;
  // v2.0.3 (D-035): the deployment id of the active release (the signed
  // deploy.deployment_id it was prepared under).
  string release_id = 6;
  uint32 replicas_desired = 7;
  uint32 replicas_healthy = 8;
  HealthEvent.Status health = 9;
  // Currently deployed commit on its branch, if known.
  string commit_sha = 10;
  // v2.1.9 (contracts v1.1.9, D-067). For a managed PostgreSQL service, the
  // reader status recorded on the running release (release_id); unset for
  // other services.
  // v2.1.10 (D-068): from the reader record of the running release (the
  // result line that activated it or the latest db_reader_ensure, whichever
  // is newer); MISSING when the release has none.
  DbReaderStatus db_reader = 11;
}

message DeploymentState {
  string deployment_id = 1;
  string project_id = 2;
  string service_id = 3;
  string plan_id = 4;
  string operation_id = 5;
  DeployStatusEvent.Phase phase = 6;
  string commit_sha = 7;
  string spec_digest_hex = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
}

message StateSnapshot {
  string server_id = 1;
  google.protobuf.Timestamp taken_at = 2;
  // Pass to EventService.Subscribe to receive every event after this
  // snapshot.
  string resume_token = 3;
  repeated ServiceState services = 4;
  // In-flight deployments plus the latest finished one per service.
  repeated DeploymentState deployments = 5;
  // Latest health per check in scope.
  repeated HealthEvent health = 6;
}
