syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";

// Shared types for agent protocol v2 (local mode).
//
// v2 is served by the agent on its unix socket (/run/permanu/agent.sock) and
// reached by the Mac engine over an SSH direct-streamlocal channel. v1
// (agent.v1.AgentService, agent dials the hosted control plane) is untouched.
// See docs/contracts/agent-protocol.md for transport, auth and limits.

// SignedPlan carries one signed-plan v1 envelope, exactly as defined in
// docs/contracts/signed-plan.md section 3.3: the UTF-8 JSON text
// {"plan": {...}, "signatures": [...]}. The agent parses it strictly (no
// duplicate keys, no unknown or missing fields, integers only) and recomputes
// the plan digest itself. No field in this protocol carries a digest, key or
// signature that the agent trusts.
//
// Plan authority is either 1-4 ES256-raw signatures from keys in
// /etc/permanu/trusted-keys.json (author.kind "user" or "agent-draft"), or,
// for author.kind "rule", a RuleInvocation inside the plan. Rule plans are
// built by the agent itself from authenticated webhooks; clients never
// submit them.
//
// Action kinds are the strings in signed-plan.md section 3.2, verbatim:
// deploy, rollback, restart, scale, env.set, secret.set, secret.unset,
// domain.add, domain.remove, cron.create, cron.update, cron.delete, cron.run,
// backup.run, backup.policy.set, backup.delete, restore, db.upgrade,
// server.add, agent.update, shell.open, rule.create, rule.revoke, key.add,
// key.revoke. Every string field named `actions` or `action` in v2 holds one
// of these. Ids inside plans are lowercase UUIDv7 strings.
message SignedPlan {
  bytes envelope_json = 1;
}

// OperationRef identifies the asynchronous operation created by an accepted
// signed change. Follow it with ChangeService.WatchOperation.
message OperationRef {
  string operation_id = 1;
  // "sha256:" + lowercase hex plan digest (signed-plan.md section 2.1),
  // computed by the agent.
  string plan_digest = 2;
  google.protobuf.Timestamp accepted_at = 3;
  // True when the same plan id and digest were already admitted;
  // operation_id is the original operation and nothing was re-executed.
  bool deduplicated = 4;
  // plan.id of the admitted plan (UUIDv7).
  string plan_id = 5;
}

// TimeRange is a half-open [start, end) interval. An unset start means
// "oldest retained"; an unset end means "now".
message TimeRange {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// Scope narrows a query to Permanu identities. Empty fields match all.
message Scope {
  string project = 1;       // project id (UUIDv7)
  string service = 2;       // service id (UUIDv7)
  string deployment_id = 3; // deployment id (UUIDv7)
  string app_id = 4;        // v1-compatible app UUID; kept for hosted-era data
}

// PageRequest is used by every unary List* RPC.
message PageRequest {
  // Max items per page. 0 means the RPC default (50); capped at 500.
  uint32 page_size = 1;
  // Opaque token from a previous PageInfo.next_page_token.
  string page_token = 2;
}

// PageInfo accompanies every List* response.
message PageInfo {
  // Empty when there are no more pages.
  string next_page_token = 1;
}

// StreamStatus is interleaved into server-streaming query responses.
message StreamStatus {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // All history matching the query has been sent; follow mode continues.
    KIND_CAUGHT_UP = 1;
    // Final frame of a non-follow query. The stream closes after it.
    KIND_END = 2;
    // Records were dropped because the client or rate limit fell behind.
    KIND_DROPPED = 3;
    // The query limit or a server cap was reached before all matches.
    KIND_TRUNCATED = 4;
    // Periodic keepalive in follow mode (every 15 s when idle).
    KIND_KEEPALIVE = 5;
  }
  Kind kind = 1;
  // Number of records dropped since the previous status frame (KIND_DROPPED).
  uint64 dropped = 2;
  // Resume cursor: pass it back as the query cursor to continue after the
  // last record delivered.
  string cursor = 3;
  string message = 4;
}

// ErrorReason refines the gRPC status code. The agent sends it as the ASCII
// trailing-metadata entry "permanu-error-reason" (enum value name).
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_SIGNATURE_INVALID = 1;      // PERMISSION_DENIED
  ERROR_REASON_KEY_UNTRUSTED = 2;          // PERMISSION_DENIED
  ERROR_REASON_KEY_REVOKED = 3;            // PERMISSION_DENIED
  ERROR_REASON_PLAN_EXPIRED = 4;           // FAILED_PRECONDITION
  ERROR_REASON_PLAN_NOT_YET_VALID = 5;     // FAILED_PRECONDITION
  ERROR_REASON_PLAN_REPLAYED = 6;          // ALREADY_EXISTS
  ERROR_REASON_PLAN_WRONG_SERVER = 7;      // FAILED_PRECONDITION
  ERROR_REASON_PLAN_MALFORMED = 8;         // INVALID_ARGUMENT
  ERROR_REASON_ACTION_NOT_PERMITTED = 9;   // PERMISSION_DENIED (action vs RPC, or rule scope)
  ERROR_REASON_STANDING_RULE_MISMATCH = 10; // PERMISSION_DENIED
  ERROR_REASON_TRUST_SET_EMPTY = 11;       // FAILED_PRECONDITION
  ERROR_REASON_CURSOR_EXPIRED = 12;        // OUT_OF_RANGE
  ERROR_REASON_RESUME_TOKEN_EXPIRED = 13;  // OUT_OF_RANGE
  ERROR_REASON_LIMIT_EXCEEDED = 14;        // RESOURCE_EXHAUSTED
  ERROR_REASON_RATE_LIMITED = 15;          // RESOURCE_EXHAUSTED
  ERROR_REASON_CAPABILITY_MISSING = 16;    // UNIMPLEMENTED
  ERROR_REASON_CONFLICT = 17;              // ABORTED
  ERROR_REASON_CLOCK_SKEW = 18;            // FAILED_PRECONDITION
  ERROR_REASON_AGENT_QUARANTINED = 19;     // FAILED_PRECONDITION
  ERROR_REASON_PROTOCOL_VERSION = 20;      // FAILED_PRECONDITION
  // Reasons 21-29 mirror signed-plan.md section 6.1 codes that have no
  // reason above. The exact code is always sent as well (see
  // VerificationFailure.code and the "permanu-plan-error" trailer).
  ERROR_REASON_PLAN_VERSION = 21;          // INVALID_ARGUMENT, E_VERSION
  ERROR_REASON_PLAN_AUTHORITY = 22;        // PERMISSION_DENIED, E_AUTHOR
  ERROR_REASON_BASE_MISMATCH = 23;         // ABORTED, E_BASE_MISMATCH
  ERROR_REASON_FORCE_FORBIDDEN = 24;       // PERMISSION_DENIED, E_FORCE_FORBIDDEN
  ERROR_REASON_TOUCH_ID_REQUIRED = 25;     // PERMISSION_DENIED, E_TOUCH_ID_REQUIRED
  ERROR_REASON_RULE_REJECTED = 26;         // PERMISSION_DENIED, E_RULE_*
  ERROR_REASON_BOOTSTRAP_REJECTED = 27;    // PERMISSION_DENIED, E_BOOTSTRAP
  ERROR_REASON_EXEC_PRECONDITION = 28;     // FAILED_PRECONDITION, E_EXEC_PRECONDITION
  ERROR_REASON_TRUST_STORE_INVALID = 29;   // FAILED_PRECONDITION, trust_store_invalid
}
