syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";

// Shared types for agent protocol v2 (local mode).
//
// v2 is served by the agent on its unix socket (/run/permanu/agent.sock) and
// reached by the Mac engine over an SSH direct-streamlocal channel. v1
// (agent.v1.AgentService, agent dials the hosted control plane) is untouched.
// See docs/contracts/agent-protocol.md for transport, auth and limits.

// SignedPlan carries one signed-plan v1 envelope, exactly as defined in
// docs/contracts/signed-plan.md section 3.3: the UTF-8 JSON text
// {"plan": {...}, "signatures": [...]}, plus the ServiceSpecs the plan names
// by spec_digest_hex (signed-plan.md 3.7). The agent parses both strictly (no
// duplicate keys, no unknown or missing fields, integers only) and recomputes
// the plan and spec digests itself. No field in this protocol carries a
// digest, key or signature that the agent trusts.
//
// Plan authority is either 1-4 ES256-raw signatures from keys in
// /etc/permanu/trusted-keys.json (author.kind "user" or "agent-draft"), or,
// for author.kind "rule", a RuleInvocation inside the plan. Rule plans are
// built by the agent itself from authenticated webhooks; clients never
// submit them.
//
// Rule-backed plans (author.kind "rule") are admitted only from the agent's
// own webhook path; a client that submits one gets PLAN_AUTHORITY (E_AUTHOR).
//
// Action kinds are the strings in signed-plan.md section 3.2, verbatim:
// deploy, rollback, restart, scale, service.elevate, operation.cancel, env.set, secret.set, secret.unset,
// service.delete, environment.delete, project.delete, volume.create,
// volume.resize, volume.delete, bucket.create, bucket.delete,
// bucket.credentials.rotate, domain.add, domain.remove, domain.switch,
// edge.rule.set, edge.rule.delete, cron.create, cron.update, cron.delete,
// cron.run, cron.pause, cron.resume, backup.run, backup.verify,
// backup.policy.set, backup.policy.delete, backup.delete, restore, db.upgrade,
// alert.rule.create, alert.rule.update, alert.rule.delete, alert.silence,
// alert.channel.create, alert.channel.update, alert.channel.delete,
// telemetry.retention.set, server.add, server.remove, agent.update,
// component.update, shell.open, rule.create, rule.revoke, key.add,
// key.revoke. v2.1.0 (contracts v1.0.7) adds backup.destination.set,
// backup.destination.delete, recovery_recipient.set, env.protection.set,
// release_key.add and release_key.revoke (signed-plan.md 3.2 is normative;
// the scheduler's run-now kind stays "cron.run").
// Every string field named `actions` or `action` in v2 holds one
// of these; an unknown kind is PLAN_MALFORMED. Ids inside plans are lowercase
// UUIDv7 strings.
message SignedPlan {
  bytes envelope_json = 1;
  // JCS text of each ServiceSpec the plan names by spec_digest_hex, each
  // <= 16 KiB, at most 64. Missing, extra or mismatched specs fail
  // SPEC_MISMATCH (E_SPEC_MISMATCH).
  repeated bytes specs_jcs = 2;
  // v2.0.1. Binary age v1 ciphertexts (each <= 64 KiB, at most 64) of the
  // secret.set and alert.channel.create/update actions, sealed to every
  // target's AgentInfo.age_recipient. Each must match exactly one
  // *ciphertext_digest_hex the plan names (SHA-256), with none missing or
  // extra, else EXEC_PRECONDITION (signed-plan.md 3.2, Sealed secrets).
  // v2.1.0 also backup.destination.set credentials. The agent never decrypts
  // them; only the runner does (D-027, agent-protocol.md 4.1).
  repeated bytes sealed_secrets = 3;
}

// OperationRef identifies the asynchronous operation created by an accepted
// signed change. Follow it with ChangeService.WatchOperation.
message OperationRef {
  string operation_id = 1;
  // 64 lowercase hex plan digest (signed-plan.md section 2.1), computed by
  // the agent.
  string plan_digest_hex = 2;
  google.protobuf.Timestamp accepted_at = 3;
  // True when the same plan id and digest were already admitted;
  // plan_id and operation_id are the original ones and nothing was
  // re-executed (idempotent success, signed-plan.md 6.1 step 8).
  bool deduplicated = 4;
  // plan.id of the admitted plan (UUIDv7).
  string plan_id = 5;
  // Field 6 was a bearer admission token. It is removed (D-022): the runner
  // binds to the agent's admission row by plan_id, plan_digest_hex and
  // action_index (signed-plan.md 6.2, 14), so OperationRef carries no secret.
  reserved 6;
  reserved "admission_token";
}

// TimeRange is a half-open [start, end) interval. An unset start means
// "oldest retained"; an unset end means "now".
message TimeRange {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// Scope narrows a query to Permanu identities. Empty fields match all.
// Every id field in v2 ends in _id and holds a lowercase UUIDv7 (D-020);
// environment is the plan's environment name (REF).
message Scope {
  string project_id = 1;
  string service_id = 2;
  string deployment_id = 3;
  string app_id = 4;         // v1-compatible app UUID; kept for hosted-era data
  string environment = 5;    // environment name, e.g. "production"
  string environment_id = 6;
}

// PageRequest is used by every unary List* RPC, including ListAdmissions.
message PageRequest {
  // Max items per page. 0 means the RPC default (50); capped at 500.
  uint32 page_size = 1;
  // Opaque token from a previous PageInfo.next_page_token.
  string page_token = 2;
}

// PageInfo accompanies every List* response.
message PageInfo {
  // Empty when there are no more pages.
  string next_page_token = 1;
}

// StreamStatus is interleaved into server-streaming query responses.
message StreamStatus {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // All history matching the query has been sent; follow mode continues.
    KIND_CAUGHT_UP = 1;
    // Final frame of a non-follow query. The stream closes after it.
    KIND_END = 2;
    // Records were dropped because the client or rate limit fell behind.
    KIND_DROPPED = 3;
    // The query limit or a server cap was reached before all matches.
    KIND_TRUNCATED = 4;
    // Periodic keepalive in follow mode (every 15 s when idle).
    KIND_KEEPALIVE = 5;
  }
  Kind kind = 1;
  // Number of records dropped since the previous status frame (KIND_DROPPED).
  uint64 dropped = 2;
  // Resume cursor: pass it back as the query cursor to continue after the
  // last record delivered.
  string cursor = 3;
  string message = 4;
}

// ErrorReason refines the gRPC status code. The agent sends it as the ASCII
// trailing-metadata entry "permanu-error-reason" (enum value name).
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_SIGNATURE_INVALID = 1;      // PERMISSION_DENIED
  ERROR_REASON_KEY_UNTRUSTED = 2;          // PERMISSION_DENIED
  ERROR_REASON_KEY_REVOKED = 3;            // PERMISSION_DENIED
  ERROR_REASON_PLAN_EXPIRED = 4;           // FAILED_PRECONDITION
  ERROR_REASON_PLAN_NOT_YET_VALID = 5;     // FAILED_PRECONDITION
  ERROR_REASON_PLAN_REPLAYED = 6;          // ALREADY_EXISTS
  ERROR_REASON_PLAN_WRONG_SERVER = 7;      // FAILED_PRECONDITION
  ERROR_REASON_PLAN_MALFORMED = 8;         // INVALID_ARGUMENT
  ERROR_REASON_ACTION_NOT_PERMITTED = 9;   // PERMISSION_DENIED (action vs RPC, or rule scope)
  ERROR_REASON_STANDING_RULE_MISMATCH = 10; // PERMISSION_DENIED
  ERROR_REASON_TRUST_SET_EMPTY = 11;       // FAILED_PRECONDITION
  ERROR_REASON_CURSOR_EXPIRED = 12;        // OUT_OF_RANGE
  ERROR_REASON_RESUME_TOKEN_EXPIRED = 13;  // OUT_OF_RANGE
  ERROR_REASON_LIMIT_EXCEEDED = 14;        // RESOURCE_EXHAUSTED
  ERROR_REASON_RATE_LIMITED = 15;          // RESOURCE_EXHAUSTED
  ERROR_REASON_CAPABILITY_MISSING = 16;    // UNIMPLEMENTED
  ERROR_REASON_CONFLICT = 17;              // ABORTED
  ERROR_REASON_CLOCK_SKEW = 18;            // FAILED_PRECONDITION
  ERROR_REASON_AGENT_QUARANTINED = 19;     // FAILED_PRECONDITION
  ERROR_REASON_PROTOCOL_VERSION = 20;      // FAILED_PRECONDITION
  // Reasons 21-29 mirror signed-plan.md section 6.1 codes that have no
  // reason above. The exact code is always sent as well (see
  // VerificationFailure.code and the "permanu-plan-error" trailer).
  ERROR_REASON_PLAN_VERSION = 21;          // INVALID_ARGUMENT, E_VERSION
  ERROR_REASON_PLAN_AUTHORITY = 22;        // PERMISSION_DENIED, E_AUTHOR
  ERROR_REASON_BASE_MISMATCH = 23;         // ABORTED, E_BASE_MISMATCH
  ERROR_REASON_FORCE_FORBIDDEN = 24;       // PERMISSION_DENIED, E_FORCE_FORBIDDEN
  ERROR_REASON_TOUCH_ID_REQUIRED = 25;     // PERMISSION_DENIED, E_TOUCH_ID_REQUIRED
  ERROR_REASON_RULE_REJECTED = 26;         // PERMISSION_DENIED, E_RULE_*
  ERROR_REASON_BOOTSTRAP_REJECTED = 27;    // PERMISSION_DENIED, E_BOOTSTRAP
  ERROR_REASON_EXEC_PRECONDITION = 28;     // FAILED_PRECONDITION, E_EXEC_PRECONDITION
  ERROR_REASON_TRUST_STORE_INVALID = 29;   // FAILED_PRECONDITION, trust_store_invalid
  ERROR_REASON_KEY_SCOPE = 30;             // PERMISSION_DENIED, E_KEY_SCOPE
  ERROR_REASON_SPEC_MISMATCH = 31;         // INVALID_ARGUMENT, E_SPEC_MISMATCH
  // admissions.db was recreated and the 1200 s quarantine is running
  // (signed-plan.md 6.3).
  ERROR_REASON_STORE_QUARANTINED = 32;     // FAILED_PRECONDITION
  // v2.0.1. The agent could not read or write its own store or files
  // (runner code E_INTERNAL). Nothing was admitted or executed; retry.
  ERROR_REASON_INTERNAL = 33;              // INTERNAL
  // v2.0.6 (contracts v1.0.6, agent-protocol.md 5). Runner execution codes
  // (signed-plan.md 14.2-14.4), sent on OperationStep.error_reason with the
  // exact code in OperationStep.error_code; before v2.0.6 they were INTERNAL.
  ERROR_REASON_SCOPE_MISMATCH = 34;         // E_SCOPE_MISMATCH (D-042)
  ERROR_REASON_PLAN_WINDOW = 35;            // E_PLAN_WINDOW
  ERROR_REASON_PLAN_CONSUMED = 36;          // E_PLAN_CONSUMED (also a closed, cancelled action, D-048)
  ERROR_REASON_PLAN_NOT_ADMITTED = 37;      // E_PLAN_NOT_ADMITTED
  ERROR_REASON_ROLLBACK_TARGET_UNKNOWN = 38; // E_ROLLBACK_TARGET_UNKNOWN
  ERROR_REASON_RULE_UNKNOWN = 39;           // E_RULE_UNKNOWN (was RULE_REJECTED)
  ERROR_REASON_RULE_SCOPE = 40;             // E_RULE_SCOPE (was RULE_REJECTED)
  // UNIMPLEMENTED from SubmitSignedPlan for agent.update and
  // component.update(runner|permanu-env) in M1 (D-046), and runner code
  // E_NOT_SUPPORTED_YET.
  ERROR_REASON_NOT_SUPPORTED_YET = 41;
  // v2.1.0 (contracts v1.0.7, D-051, agent-protocol.md 5 and 13). A staged
  // artifact is not trusted: its manifest.sig.json does not verify under an
  // active pinned release key (/etc/permanu/release-keys.json), it is signed by
  // a TEST release key in production, or release-keys.json does not load
  // (runner codes E_ARTIFACT_UNTRUSTED, release_keys_invalid). A digest or
  // version mismatch is EXEC_PRECONDITION. FAILED_PRECONDITION from
  // ArtifactService.StageArtifact; on the stage_artifact_verify step the exact
  // runner code is in OperationStep.error_code.
  ERROR_REASON_ARTIFACT_REJECTED = 42;
  // v2.1.0 (contracts v1.0.7, signed-plan.md 14.9). The runner refused a
  // scheduled run: its definition was superseded or paused, or the fire time
  // is outside the start window (E_SCHEDULE_SUPERSEDED, E_SCHEDULE_PAUSED,
  // E_SCHEDULE_WINDOW). Nothing ran.
  ERROR_REASON_SCHEDULE_REJECTED = 43;
  // v2.1.0 (contracts v1.0.7, signed-plan.md 14.10). An on-server build of a
  // rule deploy failed or timed out (E_BUILD_FAILED).
  ERROR_REASON_BUILD_FAILED = 44;
}
