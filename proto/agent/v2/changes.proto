syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";
import "agent/v2/common.proto";

// ChangeService is the only general write path in local mode. Every server
// change is a SignedPlan (docs/contracts/signed-plan.md) that the agent admits
// with the ordered verification of signed-plan.md section 6.1. The agent is
// the single admitter on a server (D-017): the runner never admits, it checks
// the admission token the agent returns. Standing rules, trusted keys and
// shells are changed by plans too: rule.create, rule.revoke, key.add and
// key.revoke go through SubmitSignedPlan, and shell.open through ShellService.
service ChangeService {
  // SubmitSignedPlan verifies, admits and enqueues a plan. Returns once
  // admitted; execution progress is observed with WatchOperation.
  // Re-submitting an admitted plan (same id and digest) is an idempotent
  // success: the original operation and admission token with
  // deduplicated=true. Rule-backed plans are refused (PLAN_AUTHORITY): only
  // the agent's internal webhook path admits them.
  rpc SubmitSignedPlan(SubmitSignedPlanRequest) returns (OperationRef);
  // VerifySignedPlan runs every check SubmitSignedPlan would, without
  // admitting, executing or reserving the nonce. Read-only.
  rpc VerifySignedPlan(VerifySignedPlanRequest) returns (VerifySignedPlanResponse);
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  // WatchOperation replays events after `after_seq`, then streams live
  // events until the operation reaches a terminal state.
  rpc WatchOperation(WatchOperationRequest) returns (stream OperationEvent);
  // CancelOperation stops an operation before its next step. It carries a
  // user-signed plan whose only action is "operation.cancel" with plan_id and
  // plan_digest_hex of the operation's plan (presence; owner, deployer, or
  // the ci key that signed that plan). Admitted like any plan.
  rpc CancelOperation(CancelOperationRequest) returns (Operation);

  // GetStateHead returns the current state head for one scope, which the
  // engine copies into plan.base.heads[server_id] (signed-plan.md 3.6).
  // Server-level plans use project_id = "" and environment = "".
  rpc GetStateHead(GetStateHeadRequest) returns (StateHead);

  // ListAdmissions syncs the admission log (plans.db admissions) to the
  // engine in ascending admission order, paged with PageRequest. It covers
  // user, agent-draft and rule plans, so the engine can record approval
  // receipts for rule-backed plans and reconcile its own replay view.
  // Read-only.
  rpc ListAdmissions(ListAdmissionsRequest) returns (ListAdmissionsResponse);

  // Standing rules and trusted keys, read-only. Changes are plans with
  // kinds rule.create / rule.revoke / key.add / key.revoke.
  rpc ListStandingRules(ListStandingRulesRequest) returns (ListStandingRulesResponse);
  rpc GetTrustedKeys(GetTrustedKeysRequest) returns (TrustedKeySet);
}

message SubmitSignedPlanRequest {
  SignedPlan plan = 1;
}

message VerifySignedPlanRequest {
  SignedPlan plan = 1;
}

message CancelOperationRequest {
  // Must be the operation of the plan named by the operation.cancel action.
  string operation_id = 1;
  SignedPlan plan = 2;
}

message VerifySignedPlanResponse {
  bool valid = 1;
  // Hex plan digest, computed by the agent.
  string plan_digest_hex = 2;
  // key_ids whose signatures verified against trusted keys.
  repeated string verified_key_ids = 3;
  // rule_id from plan.invocation, for rule plans.
  string rule_id = 4;
  // Action kinds in the plan, in order (signed-plan.md 3.2 strings).
  repeated string actions = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  // The first failed check in signed-plan.md 6.1 order. Empty when valid.
  repeated VerificationFailure failures = 8;
  string plan_id = 9;
}

message VerificationFailure {
  ErrorReason reason = 1;
  string detail = 2;
  // Exact signed-plan.md 6.1 code, e.g. "E_BASE_MISMATCH".
  string code = 3;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_QUEUED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_SUCCEEDED = 3;
  OPERATION_STATE_FAILED = 4;
  OPERATION_STATE_CANCELLED = 5;
  OPERATION_STATE_ROLLED_BACK = 6;
}

message Operation {
  string id = 1;
  // Hex plan digest.
  string plan_digest_hex = 2;
  // Action kinds, in plan order.
  repeated string actions = 3;
  OperationState state = 4;
  google.protobuf.Timestamp submitted_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  // Who authorized it: verified key ids, or the standing rule id.
  repeated string authorized_key_ids = 8;
  string standing_rule_id = 9;
  repeated OperationStep steps = 10;
  string error = 11;
  // "engine" | "webhook" | "scheduler" | "agent"
  string initiator = 12;
  // plan.id (UUIDv7).
  string plan_id = 13;
}

message OperationStep {
  uint32 index = 1;
  string name = 2;
  // Action kind this step executes.
  string action = 3;
  OperationState state = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  string error = 7;
  // Index into plan.actions.
  uint32 action_index = 8;
}

message GetOperationRequest {
  string operation_id = 1;
}

message ListOperationsRequest {
  repeated OperationState states = 1;
  TimeRange range = 2;
  PageRequest page = 3; // newest first
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  PageInfo page = 2;
}

message WatchOperationRequest {
  string operation_id = 1;
  // Resume after this event sequence number (0 = from the start).
  uint64 after_seq = 2;
}

message OperationEvent {
  string operation_id = 1;
  // Per-operation, strictly increasing, starting at 1.
  uint64 seq = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof event {
    // Step state transition (started, succeeded, failed, ...).
    OperationStep step = 4;
    StepLog log = 5;
    // Terminal snapshot; the stream closes after it.
    Operation finished = 6;
  }
}

message StepLog {
  uint32 step_index = 1;
  string stream = 2; // "stdout" | "stderr" | "agent"
  // Redacted line, max 16 KiB.
  string line = 3;
}

message GetStateHeadRequest {
  // Project id (UUIDv7), or "" for the server-level scope.
  string project_id = 1;
  // Environment name, or "" for the server-level scope.
  string environment = 2;
}

message StateHead {
  string project_id = 1;
  string environment = 2;
  // 64 lowercase hex. The genesis head is 64 x "0".
  string head_digest_hex = 3;
  // This agent's server id (UUIDv7): the key for plan.base.heads.
  string server_id = 4;
  // Plan that last advanced the head; empty at genesis.
  string last_plan_id = 5;
  google.protobuf.Timestamp updated_at = 6;
  // True during the 1200 s (20-minute) quarantine after plans.db was
  // recreated (signed-plan.md 6.3); admissions fail STORE_QUARANTINED until
  // quarantine_ends_at.
  bool quarantined = 7;
  google.protobuf.Timestamp quarantine_ends_at = 8;
}

message ListAdmissionsRequest {
  reserved 1, 2;
  reserved "cursor", "limit";
  // Include the full signed plan JSON in each record.
  bool include_signed_plan = 3;
  // page_token empty = from the oldest retained admission.
  PageRequest page = 4;
}

message ListAdmissionsResponse {
  // Ascending admission order.
  repeated Admission admissions = 1;
  // Unlike other List* RPCs, next_page_token here is a durable position
  // (it never expires) and is set even on the last page, so the engine can
  // poll for new admissions from it. It is empty only when no admission
  // exists yet.
  PageInfo page = 2;
}

message Admission {
  // plan.id (UUIDv7) and plan.nonce, as reserved in the replay store.
  string plan_id = 1;
  string nonce = 2;
  // Hex plan digest.
  string plan_digest_hex = 3;
  google.protobuf.Timestamp admitted_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  // "" while running; then "succeeded" | "failed" | "rolled_back" | "expired".
  string outcome = 6;
  // "user" | "agent-draft" | "rule".
  string author_kind = 7;
  repeated string key_ids = 8;
  string rule_id = 9;
  // Action kinds, in plan order.
  repeated string actions = 10;
  string project_id = 11;
  string environment = 12;
  // Head of the scope after this admission (hex).
  string head_after_digest_hex = 13;
  // signed-plan.md 3.3 envelope; set only when include_signed_plan.
  bytes signed_plan_json = 14;
  // plan.expires_at, for replay-window bookkeeping.
  google.protobuf.Timestamp expires_at = 15;
  // "client" (SubmitSignedPlan) or "agent_webhook" (rule plans).
  string submitter = 16;
  string operation_id = 17;
}

// StandingRuleInfo describes an installed standing rule. The rule is returned
// as its JCS text so the engine can recompute rule_digest and render it.
message StandingRuleInfo {
  string rule_id = 1;
  // JCS of the StandingRule object (signed-plan.md 3.4).
  bytes rule_jcs = 2;
  // Hex rule digest.
  string rule_digest_hex = 3;
  google.protobuf.Timestamp installed_at = 4;
  bool revoked = 5;
  google.protobuf.Timestamp revoked_at = 6;
  uint64 match_count = 7;
  google.protobuf.Timestamp last_matched_at = 8;
  // Key that signed the rule.create plan, and that plan's id.
  string created_by_key_id = 9;
  string created_plan_id = 10;
  google.protobuf.Timestamp expires_at = 11;
  // Admissions of this rule in the last 3600 s.
  uint32 invocations_last_hour = 12;
}

message ListStandingRulesRequest {
  bool include_revoked = 1;
  PageRequest page = 2;
}

message ListStandingRulesResponse {
  repeated StandingRuleInfo rules = 1;
  PageInfo page = 2;
}

// TrustedKey mirrors one entry of /etc/permanu/trusted-keys.json
// (signed-plan.md 7.2), plus its effective revocation state.
message TrustedKey {
  string key_id = 1;
  string alg = 2; // "ES256-raw"
  // 91-byte SubjectPublicKeyInfo DER of the P-256 key.
  bytes spki_der = 3;
  string label = 4; // e.g. "MacBook Pro (Secure Enclave)"
  google.protobuf.Timestamp added_at = 5;
  // True when revoked directly or by cascade.
  bool revoked = 6;
  google.protobuf.Timestamp revoked_at = 7;
  string role = 8;     // "owner" | "deployer" | "ci"
  string presence = 9; // "biometry" | "user_presence" | "none"
  // key_id of the owner that added it; empty for the TOFU root.
  string added_by_key_id = 10;
  // "lost" | "compromised" | "rotated" | "other" | "cascade"; empty if active.
  string revocation_reason = 11;
  // Key scope (signed-plan.md 7.2). Empty for owner keys; deployer and ci
  // keys always carry project_ids and environments.
  repeated string scope_project_ids = 12;
  repeated string scope_environments = 13;
  bool scope_server_level = 14;
}

message TrustedKeySet {
  repeated TrustedKey keys = 1;
  // Same value as HelloResponse.trusted_keys.fingerprint_digest_hex.
  string fingerprint_digest_hex = 2;
  uint64 generation = 3;
  // The file bytes as stored, so the engine can re-validate the chain.
  bytes trusted_keys_json = 4;
}

message GetTrustedKeysRequest {
  bool include_revoked = 1;
}
