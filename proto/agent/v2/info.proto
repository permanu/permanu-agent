syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// InfoService is the handshake and server-facts surface. All RPCs are
// read-only. Clients call Hello first on every new SSH channel.
service InfoService {
  // Hello negotiates the protocol version and returns agent identity,
  // capabilities, server facts, trust-set fingerprint and clock.
  rpc Hello(HelloRequest) returns (HelloResponse);
  // GetServerFacts re-probes host facts (docker/swarm/dwaar state may change).
  rpc GetServerFacts(GetServerFactsRequest) returns (ServerFacts);
  // Ping measures round trip and clock skew.
  rpc Ping(PingRequest) returns (PingResponse);
}

message HelloRequest {
  // Client identity, e.g. "permanu-engine".
  string client_name = 1;
  string client_version = 2;
  // Protocol versions the client speaks, e.g. ["2.0"]. The agent picks the
  // highest common one or fails with FAILED_PRECONDITION/PROTOCOL_VERSION.
  repeated string protocol_versions = 3;
  google.protobuf.Timestamp client_time = 4;
  // v2.1.0. The Mac engine's install id (UUIDv7, stable per engine data
  // directory). Only a connection whose client_name is "permanu-engine" and
  // whose engine_id is set counts toward engine presence ("Mac online",
  // agent-protocol.md 12). "" for other clients (tests, CLI probes).
  string engine_id = 5;
}

message HelloResponse {
  // Selected protocol version, "<major>.<minor>".
  string protocol_version = 1;
  AgentInfo agent = 2;
  // Capability ids, e.g. "telemetry.logs", "telemetry.traces",
  // "telemetry.metrics", "telemetry.analytics", "schedules.cron", "backups",
  // "alerts", "webhooks", "builds.server", "shell", "swarm". Clients must
  // gate UI and calls on these; missing ones return UNIMPLEMENTED.
  // v2.0.2 adds (agent-protocol.md section 2):
  //   "signed_plans.v1" - admits signed-plan v1 envelopes (SubmitSignedPlan,
  //                       VerifySignedPlan, CancelOperation) and drives their
  //                       execution through the runner (signed-plan.md 14.6).
  //   "admissions.v1"   - admissions.db schema of signed-plan.md 6.4 with the
  //                       v1.0.2 columns; ListAdmissions and GetStateHead.
  //   "age.v1"          - AgentInfo.age_recipient is set and the runner
  //                       decrypts SignedPlan.sealed_secrets (D-027).
  // v2.0.3 adds (contracts v1.0.3):
  //   "deployment_ids.v1"   - admits signed-plan v1.0.3 deploy.deployment_id
  //                           and rollback.to_deployment_id (to_release_id
  //                           alias), copies them into
  //                           admission_actions.deployment_id and never mints
  //                           one (D-035). An engine requires it before it
  //                           submits a deploy or rollback.
  //   "logs.containers.v1"  - QueryLogs serves APP and SERVICE sources,
  //                           including follow, from the runner's read-only
  //                           ops list_containers, container_logs and
  //                           container_logs_follow, without the telemetry
  //                           store (D-036). The engine reads server logs only
  //                           through QueryLogs, never over SSH.
  //   "service_kind.v1"     - v2.0.5 (contracts v1.0.5, D-045): admits
  //                           ServiceSpecs with service_kind and server.add
  //                           plans with age_recipient_fingerprint, and fills
  //                           Container.environment and Container.service_kind
  //                           from the permanu.environment and
  //                           permanu.service_kind labels. An engine requires
  //                           it before it submits a plan that names a spec.
  // v2.1.0 adds (contracts v1.0.7, agent-protocol.md 2 and 9-13; Hello
  // negotiates "2.1"). The illustrative ids above ("telemetry.logs",
  // "schedules.cron", "backups", "alerts", "webhooks", "builds.server") are
  // never advertised; these are the gates:
  //   "telemetry.v1" - the telemetry store (retention, caps, redaction before
  //                    write), log ingestion from the runner's
  //                    logs_follow_stream, the OTLP listener (D-053, D-054)
  //                    and every TelemetryService RPC served from the store.
  //   "cron.v1"      - ScheduleService, the cron.* kinds and run_cron.
  //   "backups.v1"   - BackupService, the backup.* kinds, restore,
  //                    backup.destination.*, recovery_recipient.set (D-049).
  //   "alerts.v1"    - AlertService, the alert.* kinds and the evaluator.
  //   "webhooks.v1"  - webhook intake, WebhookService, rule.create /
  //                    rule.revoke and rule-backed deploys built on the
  //                    server by BuildKit (D-050).
  //   "artifacts.v1" - ArtifactService.StageArtifact, release keys
  //                    (release_key.*), and agent.update / component.update
  //                    for runner and permanu-env are admitted (D-051; lifts
  //                    the v2.0.6 NOT_SUPPORTED_YET refusal).
  // v2.1.2 adds (contracts v1.1.2, D-060; Hello still negotiates "2.1"):
  //   "analytics.v1" - QueryAnalytics is served from the analytics store and
  //                    honours AnalyticsQuery.service_ids. An engine requires
  //                    it before it sends service_ids (an older agent ignores
  //                    the field and would return every service's rows).
  // v2.1.3 (contracts v1.1.3, D-061; Hello still negotiates "2.1") adds no
  // capability: BACKUP_RUN_STATUS_MISSED, ServerBuild.runner_build_id and
  // WebhookQueueStatus.webhook_host are additive, and an engine shows an
  // unknown enum value as a generic status.
  // v2.1.4 (contracts v1.1.4, D-062; Hello still negotiates "2.1") changes
  // comments only: re-matched PENDING deliveries, RATE_LIMITED plan retries
  // and BackupArtifact.last_verification from manual verifies.
  repeated string capabilities = 3;
  ServerFacts server = 4;
  TrustedKeysSummary trusted_keys = 5;
  ClockInfo clock = 6;
  // Per-connection id for audit correlation.
  string session_id = 7;
  // v2.1.0. Agent health, engine presence and the "while you were away"
  // counters (agent-protocol.md 12). The same message is pushed as
  // EventService EVENT_KIND_AGENT_STATUS.
  AgentStatus status = 8;
}

message AgentInfo {
  string version = 1;
  // Lowercase hex SHA-256 of the running binary.
  string binary_digest_hex = 2;
  // All protocol versions this agent can serve.
  repeated string protocol_versions = 3;
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_LOCAL = 1;  // v2 socket only
    MODE_HOSTED = 2; // v1 control-plane dial-out only (v2 not served)
    MODE_BOTH = 3;
  }
  Mode mode = 4;
  google.protobuf.Timestamp started_at = 5;
  // Mirrors v1 HeartbeatRequest.agent_quarantined / quarantine_reason. While
  // quarantined every mutating RPC fails with AGENT_QUARANTINED.
  bool quarantined = 6;
  string quarantine_reason = 7;
  // The server id: the server_id of /etc/permanu/trusted-keys.json, written
  // once by the server.add bootstrap from the engine's UUIDv7 (signed-plan.md
  // 7.2, 7.3). "" before bootstrap (trusted_keys.state = ABSENT). Signed plans
  // must name it in targets.
  string server_id = 8;
  // Hex SHA-256 of each SSH host public key blob (/etc/ssh/ssh_host_*_key.pub).
  // A server.add plan's ssh_host_key_digest_hex must be one of them.
  repeated string ssh_host_key_digests_hex = 9;
  // v2.0.1. The age X25519 recipient ("age1...") of this server. The engine
  // seals secret.set and alert.channel values to it; the plan signs the
  // SHA-256 of the binary age ciphertext (signed-plan.md 3.2, Sealed
  // secrets). v2.0.4 (D-037): the agent reads it from
  // /etc/permanu/age/recipient (root:root 0644; v2.0.2 and v2.0.3 used
  // /var/lib/permanu/agent/age-recipient); the identity
  // (/etc/permanu/age/identity, root:root 0400) is created by the installer,
  // never overwritten, never leaves the server, and only the runner decrypts
  // with it. v2.0.5 (D-045): a bootstrap server.add must sign
  // age_recipient_fingerprint = hex SHA-256 of this string, else
  // BOOTSTRAP_REJECTED.
  string age_recipient = 10;
  // v2.1.0 (D-051). /etc/permanu/release-keys.json, the pinned Ed25519
  // release keys that must sign every bundle manifest the runner installs.
  ReleaseKeysSummary release_keys = 11;
  // v2.1.0 (D-049). Hex SHA-256 of the owner recovery age recipient string
  // of the last admitted recovery_recipient.set; "" when none was admitted
  // (then backup.policy.set and backup runs fail EXEC_PRECONDITION).
  string recovery_recipient_fingerprint = 12;
  // v2.1.0. Hex SHA-256 of /usr/lib/permanu/manifest.json, the installed
  // server bundle (signed-plan.md 3.2 "Bundle manifest").
  string bundle_manifest_digest_hex = 13;
}

// ReleaseKeysSummary describes /etc/permanu/release-keys.json (v2.1.0,
// D-051, agent-protocol.md 10.4). The agent only reads it; the runner writes it
// at server.add (from the signed bundle) and for release_key.add/revoke.
message ReleaseKeysSummary {
  // Hex SHA-256 of JCS(parsed file); "" when absent or unparseable.
  string fingerprint_digest_hex = 1;
  // Active (not revoked) key ids, sorted.
  repeated string key_ids = 2;
  TrustedKeysSummary.TrustState state = 3;
  string invalid_reason = 4;
  // True only on a dev/QA agent build that trusts the TEST release key. A
  // production agent never does, and the runner refuses a manifest signed
  // only by it.
  bool test_key_trusted = 5;
}

// AgentStatus is the agent-side source of the Engine API servers.agent_status
// fields (agent-protocol.md 12.3).
message AgentStatus {
  enum Health {
    HEALTH_UNSPECIFIED = 0;
    HEALTH_OK = 1;
    // Serving, with at least one degraded_reasons entry.
    HEALTH_DEGRADED = 2;
    // AgentInfo.quarantined or StateHead.quarantined; mutations fail.
    HEALTH_QUARANTINED = 3;
  }
  Health health = 1;
  // Stable lowercase ids, sorted: "runner_unreachable", "telemetry_dropping",
  // "telemetry_ingest_paused", "telemetry_store_reset", "otlp_unbound",
  // "buildkit_unavailable" (v2.1.9, contracts v1.1.9, D-067: the runner's
  // diagnose check buildkit_apparmor reads absent),
  // "account_ids" (v2.1.11, contracts v1.1.11, D-069: diagnose account_ids
  // reads migrate — a Permanu account is off its fixed id, id-migration is
  // non-empty, or /home/permanu-shell is not 900100:900100), "disk_pressure",
  // "clock_unsynced",
  // "trust_store_invalid", "release_keys_invalid",
  // "recovery_recipient_missing", "scheduler_behind". Clients show an unknown
  // id verbatim. Engine API AgentStatus.health / degraded_reasons carry
  // health and this list (agent-protocol.md 12.3).
  repeated string degraded_reasons = 2;
  // True while at least one engine session is live (agent-protocol.md 12.1).
  bool engine_online = 3;
  // Last time any engine session was live; unset if none ever connected.
  google.protobuf.Timestamp engine_last_seen_at = 4;
  // engine_id of the most recent engine session.
  string engine_id = 5;
  // The "while you were away" counters (agent-protocol.md 12.2).
  AwaySummary away = 6;
  uint32 alerts_firing = 7;
  uint32 webhook_pending = 8;
  uint32 cron_jobs = 9;
  google.protobuf.Timestamp next_cron_run_at = 10;
  google.protobuf.Timestamp next_backup_at = 11;
  // Last scheduled verify-restore that passed, over every policy.
  google.protobuf.Timestamp last_verify_passed_at = 12;
  bool server_builds_enabled = 13;
  // "<gateway ipv4>:4317" / "<gateway ipv4>:4318" while bound; "" otherwise.
  string otlp_grpc_listen = 14;
  string otlp_http_listen = 15;
  // Sum of TelemetryUsage.bytes_used over every kind.
  uint64 telemetry_bytes_used = 16;
  google.protobuf.Timestamp computed_at = 17;
}

// AwaySummary counts what the server did during the most recent period with
// no engine session (agent-protocol.md 12.2). While offline the counters grow
// and until is unset; when a session starts, until is set and the summary is
// frozen, so every connection of that engine sees the same values until the
// next offline period begins. All zero and unset before the first session.
message AwaySummary {
  // When the previous engine session ended.
  google.protobuf.Timestamp since = 1;
  uint32 operations = 2;
  uint32 operations_failed = 3;
  // Rule-backed deploys admitted from webhooks.
  uint32 rule_deploys = 4;
  uint32 server_builds_failed = 5;
  uint32 webhook_deliveries = 6;
  uint32 alerts_fired = 7;
  uint32 cron_runs_failed = 8;
  uint32 cron_runs_missed = 9;
  uint32 backups_failed = 10;
  uint32 verifications_failed = 11;
  // When the current engine session started; unset while still offline.
  google.protobuf.Timestamp until = 12;
}

message TrustedKeysSummary {
  // Lowercase hex SHA-256 of JCS(parsed trusted-keys.json) (signed-plan.md
  // 7.2). "" when the file is absent or cannot be parsed.
  string fingerprint_digest_hex = 1;
  uint32 key_count = 2;
  // Monotonic generation, bumped on every add/revoke.
  uint64 generation = 3;
  // v2.0.1. Trust state of the file.
  enum TrustState {
    TRUST_STATE_UNSPECIFIED = 0;
    // No file: bootstrap state; only a server.add plan is accepted.
    TRUST_STATE_ABSENT = 1;
    // Loaded and passed every signed-plan.md 7.2 rule.
    TRUST_STATE_VALID = 2;
    // Present but failed a rule; every admission fails TRUST_STORE_INVALID.
    TRUST_STATE_INVALID = 3;
  }
  TrustState state = 4;
  // Which 7.2 rule failed when state = INVALID; empty otherwise.
  string invalid_reason = 5;
}

message ClockInfo {
  google.protobuf.Timestamp agent_time = 1;
  bool ntp_synchronized = 2;
  // Agent-estimated skew versus HelloRequest.client_time (agent - client).
  google.protobuf.Duration estimated_skew = 3;
  string timezone = 4; // IANA name of the host timezone
}

message GetServerFactsRequest {}

message ServerFacts {
  string hostname = 1;
  string machine_id = 2;
  OsInfo os = 3;
  string arch = 4; // "amd64" | "arm64"
  CpuInfo cpu = 5;
  uint64 memory_total_bytes = 6;
  uint64 memory_available_bytes = 7;
  repeated DiskInfo disks = 8;
  DockerInfo docker = 9;
  DwaarInfo dwaar = 10;
  string public_ipv4 = 11;
  string public_ipv6 = 12;
  google.protobuf.Timestamp boot_time = 13;
  // Same values as v1 HeartbeatRequest.buildx_status.
  string buildx_status = 14;
  google.protobuf.Timestamp probed_at = 15;
}

message OsInfo {
  string name = 1;    // e.g. "ubuntu"
  string version = 2; // e.g. "24.04"
  string kernel = 3;
}

message CpuInfo {
  string model = 1;
  uint32 cores = 2;
}

message DiskInfo {
  string mount = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 used_bytes = 4;
}

message DockerInfo {
  bool installed = 1;
  bool reachable = 2;
  string version = 3;
  string storage_driver = 4;
  SwarmInfo swarm = 5;
}

message SwarmInfo {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_INACTIVE = 1;
    STATE_PENDING = 2;
    STATE_ACTIVE = 3;
    STATE_ERROR = 4;
    STATE_LOCKED = 5;
  }
  State state = 1;
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_MANAGER = 1;
    ROLE_WORKER = 2;
  }
  Role role = 2;
  string node_id = 3;
  string cluster_id = 4;
  uint32 managers = 5;
  uint32 nodes = 6;
}

message DwaarInfo {
  bool installed = 1;
  bool running = 2;
  string version = 3;
  bool admin_socket_reachable = 4;
}

message PingRequest {
  google.protobuf.Timestamp client_time = 1;
}

message PingResponse {
  google.protobuf.Timestamp client_time = 1; // echoed
  google.protobuf.Timestamp agent_time = 2;
}
