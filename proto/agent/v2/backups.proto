syntax = "proto3";

package permanu.agent.v2;

option go_package = "github.com/permanu/permanu-ai/internal/agentpb/v2;agentv2";

import "google/protobuf/timestamp.proto";
import "agent/v2/common.proto";

// BackupService exposes backup policies, runs, verify-restore results and
// artifacts. All RPCs are read-only. One retention model everywhere
// (signed-plan.md backup.policy.set, Engine API BackupPolicy): keep_daily,
// keep_weekly, keep_monthly and verify_schedule. Mutations are signed changes via
// ChangeService.SubmitSignedPlan with kinds "backup.policy.set",
// "backup.run", "backup.verify", "backup.policy.delete" (owner only),
// "backup.delete" and "restore" (both owner only, always-fresh Touch ID,
// never a standing rule).
// v2.1.0 (capability "backups.v1", agent-protocol.md 10.2): destinations are
// signed too ("backup.destination.set", "backup.destination.delete"), every
// artifact is age-encrypted to the server recipient AND the owner recovery
// recipient ("recovery_recipient.set", D-049), and a scheduled verify-restore
// runs weekly by default. The agent never sees destination credentials: the
// runner decrypts them inside backup_run, backup_verify, backup_prune,
// backup_delete and restore_backup. Object layout, manifest and digests are
// signed-plan.md 3.8's.
service BackupService {
  rpc ListBackupPolicies(ListBackupPoliciesRequest) returns (ListBackupPoliciesResponse);
  rpc GetBackupPolicy(GetBackupPolicyRequest) returns (BackupPolicy);
  rpc ListBackupRuns(ListBackupRunsRequest) returns (ListBackupRunsResponse);
  rpc GetBackupRun(GetBackupRunRequest) returns (BackupRun);
  rpc ListRestoreVerifications(ListRestoreVerificationsRequest) returns (ListRestoreVerificationsResponse);
  rpc ListBackupArtifacts(ListBackupArtifactsRequest) returns (ListBackupArtifactsResponse);
  // v2.1.0. Signed backup destinations (credentials never returned).
  rpc ListBackupDestinations(ListBackupDestinationsRequest) returns (ListBackupDestinationsResponse);
  // v2.1.0. Streams one server_local (KIND_LOCAL) artifact's age ciphertext,
  // exactly as stored under /var/lib/permanu/backups, for Engine API
  // backups.download; the Mac decrypts it with the owner recovery identity
  // (D-049). The agent never decrypts. Artifacts at remote destinations are
  // fetched by the engine itself (signed-plan.md 3.8); asking for one is
  // FAILED_PRECONDITION + EXEC_PRECONDITION.
  // Read-only; one concurrent download per agent (RESOURCE_EXHAUSTED /
  // RATE_LIMITED otherwise).
  rpc ReadBackupArtifact(ReadBackupArtifactRequest) returns (stream BackupArtifactChunk);
}

message BackupSource {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_POSTGRES = 1; // pg_dump custom format
    KIND_MYSQL = 2;
    KIND_REDIS = 3;
    KIND_VOLUME = 4;   // tar of a docker volume
  }
  Kind kind = 1;
  string service_id = 2;
  string database = 3;
  string volume = 4;
}

message BackupDestination {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_LOCAL = 1;
    KIND_S3 = 2;
    KIND_R2 = 3;
    KIND_B2 = 4;
    KIND_SFTP = 5;
  }
  Kind kind = 1;
  string bucket = 2;
  string prefix = 3;
  string endpoint = 4;
  string region = 5;
  // Name of the server-side credential; the value is never returned.
  string credential_ref = 6;
  // v2.1.0. The signed destination_ref of backup.destination.set, which is
  // the Engine API BackupDestination.id (a UUIDv7). KIND_LOCAL is the
  // server_local kind (root /var/lib/permanu/backups), also set by a plan.
  string id = 7;
  string name = 8;
  // v2.1.0. SHA-256 of the sealed credential ciphertext the plan signed
  // ("" for KIND_LOCAL). The value is decrypted only by the runner.
  string credential_ciphertext_digest_hex = 9;
  string plan_digest_hex = 10;
}

message BackupRetention {
  reserved 1;
  reserved "keep_last";
  uint32 keep_daily = 2;   // 0-366
  uint32 keep_weekly = 3;  // 0-260
  uint32 keep_monthly = 4; // 0-120; at least one keep_* > 0
}

message BackupPolicy {
  string id = 1;
  string name = 2;
  Scope scope = 3;
  BackupSource source = 4;
  BackupDestination destination = 5;
  string schedule = 6; // cron expression
  string timezone = 7;
  BackupRetention retention = 8;
  // age recipient fingerprints the artifact is encrypted to. v2.1.0 (D-049):
  // exactly two, in this order: hex SHA-256 of the server recipient
  // (AgentInfo.age_recipient) and of the owner recovery recipient
  // (AgentInfo.recovery_recipient_fingerprint).
  repeated string age_recipients = 9;
  // Verify-restore schedule, 5-field cron (the app defaults to weekly,
  // "0 4 * * 0"). "" = disabled (plan verify_schedule null).
  string verify_schedule = 10;
  reserved 11;
  reserved "timeout";
  bool enabled = 12;
  // NotificationChannel ids for failure alerts.
  repeated string channel_ids = 13;
  google.protobuf.Timestamp next_run_at = 14;
  BackupRun last_run = 15;
  RestoreVerification last_verification = 16;
  string plan_digest_hex = 17;
  // Per-run timeout (agent default 6 h; not a plan field in v2.0).
  uint32 timeout_seconds = 18;
  // v2.1.0. The plan's destination_ref (a BackupDestination.id).
  string destination_id = 19;
}

enum BackupRunStatus {
  BACKUP_RUN_STATUS_UNSPECIFIED = 0;
  BACKUP_RUN_STATUS_PENDING = 1;
  BACKUP_RUN_STATUS_DUMPING = 2;
  BACKUP_RUN_STATUS_ENCRYPTING = 3;
  BACKUP_RUN_STATUS_UPLOADING = 4;
  BACKUP_RUN_STATUS_SUCCEEDED = 5;
  BACKUP_RUN_STATUS_FAILED = 6;
  BACKUP_RUN_STATUS_CANCELLED = 7;
}

message BackupRun {
  string id = 1;
  string policy_id = 2;
  BackupRunStatus status = 3;
  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    TRIGGER_SCHEDULE = 1;
    TRIGGER_MANUAL = 2;
    TRIGGER_PRE_CHANGE = 3; // taken automatically before a migration/restore/upgrade (v2.1.0: restore_backup's pre_restore backup)
  }
  Trigger trigger = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  uint64 size_bytes = 7;
  string artifact_id = 8;
  string error = 9;
  string operation_id = 10;
  // v2.1.0. Hex SHA-256 of the encrypted artifact (BackupArtifact
  // content_digest_hex = the manifest's backup_digest_hex, signed-plan.md
  // 3.8); "" until SUCCEEDED.
  string content_digest_hex = 11;
}

enum RestoreVerificationStatus {
  RESTORE_VERIFICATION_STATUS_UNSPECIFIED = 0;
  RESTORE_VERIFICATION_STATUS_RUNNING = 1;
  RESTORE_VERIFICATION_STATUS_PASSED = 2;
  RESTORE_VERIFICATION_STATUS_FAILED = 3;
}

// RestoreVerification is the result of restoring an artifact into a
// throwaway container and running sanity checks.
message RestoreVerification {
  string id = 1;
  string policy_id = 2;
  string artifact_id = 3;
  RestoreVerificationStatus status = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  repeated VerificationCheck checks = 7;
  string error = 8;
  // v2.1.0. SCHEDULE (verify_schedule) or MANUAL (a backup.verify plan).
  BackupRun.Trigger trigger = 9;
  // v2.1.0. Set for a backup.verify plan.
  string operation_id = 10;
}

message VerificationCheck {
  string name = 1; // e.g. "tables_present", "row_count:public.users"
  bool passed = 2;
  string detail = 3;
}

message BackupArtifact {
  string id = 1;
  string policy_id = 2;
  string run_id = 3;
  // Destination URI with credentials stripped.
  string location = 4;
  uint64 size_bytes = 5;
  // Hex SHA-256 of the encrypted artifact (plan restore.backup_digest_hex).
  string content_digest_hex = 6;
  bool encrypted = 7;
  repeated string age_recipients = 8;
  google.protobuf.Timestamp created_at = 9;
  // When retention will delete it; unset while a keep_* rule holds it.
  google.protobuf.Timestamp expires_at = 10;
  RestoreVerificationStatus last_verification = 11;
}

message ListBackupPoliciesRequest {
  Scope scope = 1;
  PageRequest page = 2;
}

message ListBackupPoliciesResponse {
  repeated BackupPolicy policies = 1;
  PageInfo page = 2;
}

message GetBackupPolicyRequest {
  string policy_id = 1;
}

message ListBackupRunsRequest {
  string policy_id = 1;
  repeated BackupRunStatus statuses = 2;
  TimeRange range = 3;
  PageRequest page = 4; // newest first
}

message ListBackupRunsResponse {
  repeated BackupRun runs = 1;
  PageInfo page = 2;
}

message GetBackupRunRequest {
  string run_id = 1;
}

message ListRestoreVerificationsRequest {
  string policy_id = 1;
  string artifact_id = 2;
  PageRequest page = 3;
}

message ListRestoreVerificationsResponse {
  repeated RestoreVerification verifications = 1;
  PageInfo page = 2;
}

message ListBackupArtifactsRequest {
  string policy_id = 1;
  TimeRange range = 2;
  PageRequest page = 3;
}

message ListBackupArtifactsResponse {
  repeated BackupArtifact artifacts = 1;
  PageInfo page = 2;
}

// v2.1.0.
message ListBackupDestinationsRequest {
  PageRequest page = 1;
}

message ListBackupDestinationsResponse {
  repeated BackupDestination destinations = 1;
  PageInfo page = 2;
}

message ReadBackupArtifactRequest {
  string artifact_id = 1;
  // Resume offset in bytes (0 = from the start).
  uint64 offset = 2;
}

// BackupArtifactChunk frames are <= 1 MiB of ciphertext in order. The last
// frame has last = true and repeats the artifact's content_digest_hex, which
// the engine checks over the whole ciphertext before it decrypts.
message BackupArtifactChunk {
  uint64 offset = 1;
  bytes data = 2;
  uint64 total_bytes = 3;
  bool last = 4;
  string content_digest_hex = 5;
}
