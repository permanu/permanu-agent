name: Permanu Agent CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: Explicit CI lane to run manually.
        required: true
        type: choice
        default: pr
        options:
          - pr
          - main
          - release
          - all

permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: read
  id-token: write

concurrency:
  group: permanu-agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  pr-quality:
    name: permanu-ci / agent / pr-quality
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config protobuf-compiler
          fi
          if command -v rustup >/dev/null 2>&1; then
            rustup component add rustfmt
          fi

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked --all-targets

      - name: Release signing helper tests
        run: scripts/test-sign-release.sh

  main-artifact:
    name: permanu-ci / agent / main-artifact
    needs: [pr-quality]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'main' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install release build tools
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential musl-tools pkg-config protobuf-compiler
          fi
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

      - name: Build Linux release artifacts
        run: scripts/build-release.sh
        env:
          ARCHES: amd64 arm64

      - name: Upload release artifact preview
        uses: actions/upload-artifact@v4
        with:
          name: permanu-agent-main-artifacts
          path: dist/
          retention-days: 14

  github-release:
    name: permanu-ci / agent / github-release
    needs: [pr-quality]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version tag
        run: scripts/check-version.sh

      - name: Install release build tools
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential musl-tools pkg-config protobuf-compiler
          fi
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi

      - name: Build Linux release artifacts
        run: scripts/build-release.sh
        env:
          ARCHES: amd64 arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign release artifacts
        run: scripts/sign-release.sh dist
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          PERMANU_COSIGN_KEY: ${{ secrets.PERMANU_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGSTORE_ID_TOKEN: ${{ secrets.SIGSTORE_ID_TOKEN }}
          PERMANU_SIGSTORE_ID_TOKEN: ${{ secrets.PERMANU_SIGSTORE_ID_TOKEN }}

      - name: Generate release notes
        run: scripts/release-notes.sh > dist/RELEASE_NOTES.md

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: permanu-agent-release
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/permanu-agent-linux-amd64*
            dist/permanu-agent-linux-arm64*
            dist/permanu-agent-release.json
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
