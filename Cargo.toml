[package]
name = "permanu-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
bollard = "0.21"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-native-roots", "tls-ring"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
