[package]
name = "permanu-agent"
version = "0.1.0"
edition = "2021"

[features]
# Default-off whole-transaction transport; no production backend or enrollment configured.
compose-release-v1 = []
# Development only, never in release builds: PERMANU_AGENT_DEV_ROOT moves every
# local-mode path under an unprivileged dir for the engine smoke test.
dev-paths = []
# QA bundles only, never in release builds: trust the public TEST release keys
# (D-051), like the runner's feature of the same name.
test-release-keys = []

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
age = { version = "=0.12.1", default-features = false }
base64 = "0.22"
bollard = "0.21"
curve25519-dalek = { version = "4.1", default-features = false }
# Release manifest signatures (signed-plan.md 3.9): strict RFC 8032 verify.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
# Cron fire times in the job's IANA timezone from the tz database compiled
# into the agent, never the host's (agent-protocol.md 10).
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
hyper-util = { version = "0.1", features = ["tokio"] }
flate2 = "1"
libc = "0.2"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics", "with-serde"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
prost = "0.14"
prost-types = "0.14"
regex = "1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "gzip", "router", "server", "tls-native-roots", "tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
